<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Floppy Bird</title>
  <meta name="description" content="Floppy Bird — un jeu d'arcade à une touche. Vole entre les tuyaux, enchaîne les passages parfaits, bats ton record.">
  <meta name="theme-color" content="#4fc3f7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Floppy Bird">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <canvas id="game" aria-label="Zone de jeu"></canvas>

    <button id="mute" class="icon-btn" type="button" aria-label="Couper le son">🔊</button>

    <section id="menu" class="overlay">
      <h1 class="logo">Floppy<br>Bird</h1>
      <button id="btn-start" class="btn primary big" type="button">Start</button>
    </section>

    <section id="over" class="overlay hidden">
      <div class="card">
        <div class="medal" id="medal" aria-hidden="true"></div>
        <div class="scores">
          <div><span class="value" id="over-score">0</span></div>
          <div><span class="label" aria-label="Record"></span><span id="over-best" class="value small">0</span></div>
        </div>
        <span id="new-best" class="new-best hidden" aria-label="Nouveau record">★</span>
      </div>
      <button id="btn-retry" class="btn primary big" type="button">Restart</button>
    </section>
  </main>

  <script src="game.js"></script>
</body>
</html>
